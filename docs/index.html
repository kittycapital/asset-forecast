<style>

<body>
<header class="hv-header"><div class="hv-header-inner"><div class="hv-header-center"><h1>자산 프랙탈 예측</h1><div class="hv-header-sub">Asset Fractal · 15 Assets · 30D → 7D</div></div><div class="hv-header-right"><div class="hv-update-badge"><span class="hv-live-dot"></span><span id="lastUpdate">—</span></div></div></div></header>
<div class="hv-page">
<div class="cat-bar" id="catBar">
<button class="cat-btn active" data-cat="all">전체</button>
<button class="cat-btn" data-cat="us_equity">미국 주식</button>
<button class="cat-btn" data-cat="global">글로벌</button>
<button class="cat-btn" data-cat="dividend">배당</button>
<button class="cat-btn" data-cat="commodity">원자재</button>
<button class="cat-btn" data-cat="bond">채권</button>
<button class="cat-btn" data-cat="crypto">크립토</button>
</div>
<div class="asset-grid" id="assetGrid"></div>
<div id="mainContent"><div class="loading-overlay"><div class="spinner"></div><div class="loading-text">데이터 로딩 중...</div></div></div>
</div>

<script>
/* ===== CONFIG ===== */
var ASSETS={
  SPY:{name:'S&P 500',cat:'us_equity',color:'#4a9eff',file:'SPY.csv'},
  QQQ:{name:'나스닥 100',cat:'us_equity',color:'#a855f7',file:'QQQ.csv'},
  DIA:{name:'다우 30',cat:'us_equity',color:'#06b6d4',file:'DIA.csv'},
  IWM:{name:'러셀 2000',cat:'us_equity',color:'#ec4899',file:'IWM.csv'},
  ARKK:{name:'ARK 혁신',cat:'us_equity',color:'#f43f5e',file:'ARKK.csv'},
  EWY:{name:'한국 MSCI',cat:'global',color:'#3b82f6',file:'EWY.csv'},
  EEM:{name:'신흥국',cat:'global',color:'#10b981',file:'EEM.csv'},
  SCHD:{name:'배당 성장',cat:'dividend',color:'#8b5cf6',file:'SCHD.csv'},
  GLD:{name:'금',cat:'commodity',color:'#ffd642',file:'GLD.csv'},
  SLV:{name:'은',cat:'commodity',color:'#94a3b8',file:'SLV.csv'},
  USO:{name:'원유',cat:'commodity',color:'#78350f',file:'USO.csv'},
  XLE:{name:'에너지',cat:'commodity',color:'#ea580c',file:'XLE.csv'},
  TLT:{name:'미국 장기채',cat:'bond',color:'#06b6d4',file:'TLT.csv'},
  BTC_USD:{name:'비트코인',cat:'crypto',color:'#f7931a',file:'BTC_USD.csv'},
  ETH_USD:{name:'이더리움',cat:'crypto',color:'#627eea',file:'ETH_USD.csv'}
};
var ORDER=['SPY','QQQ','DIA','IWM','ARKK','EWY','EEM','SCHD','GLD','SLV','USO','XLE','TLT','BTC_USD','ETH_USD'];
var LB=30,FW=7,TOP_N=15;
var OV_C=['#06b6d4','#a855f7','#ff8c42'];
var csvCache={},curAsset='SPY',curResult=null,mainChart=null,selOv=[];

/* ===== CSV ===== */
function loadCSV(ticker){
  if(csvCache[ticker])return Promise.resolve(csvCache[ticker]);
  return new Promise(function(res,rej){
    Papa.parse('data/raw/'+ASSETS[ticker].file,{download:true,header:true,skipEmptyLines:true,
      complete:function(r){
        var rows=r.data.filter(function(x){return x.Date&&x.Close})
          .map(function(x){return{date:x.Date,price:parseFloat(x.Close)}})
          .filter(function(x){return!isNaN(x.price)&&x.price>0})
          .sort(function(a,b){return a.date.localeCompare(b.date)});
        csvCache[ticker]=rows;res(rows);
      },error:rej});
  });
}

/* ===== MATH ===== */
function dRet(p){var r=[];for(var i=1;i<p.length;i++)r.push((p[i]-p[i-1])/p[i-1]);return r}
function pears(a,b){
  var n=a.length;if(!n)return 0;
  var ma=0,mb=0,i;for(i=0;i<n;i++){ma+=a[i];mb+=b[i]}ma/=n;mb/=n;
  var nm=0,da=0,db=0;for(i=0;i<n;i++){var x=a[i]-ma,y=b[i]-mb;nm+=x*y;da+=x*x;db+=y*y}
  var dn=Math.sqrt(da)*Math.sqrt(db);return dn===0?0:nm/dn;
}

/* ===== ANALYSIS ===== */
function analyze(data){
  var prices=data.map(function(d){return d.price});
  var dates=data.map(function(d){return d.date});
  var n=prices.length;
  if(n<LB+FW+LB)return{error:'데이터가 부족합니다 (최소 '+(LB*2+FW)+'일 필요)'};
  var cw=prices.slice(n-LB),cr=dRet(cw),cp=prices[n-1],cd=dates[n-1];
  var matches=[];
  for(var i=LB;i<=n-LB-FW;i++){
    var w=prices.slice(i,i+LB),ret=dRet(w),corr=pears(cr,ret);
    if(corr>0.5){
      var fp=prices.slice(i+LB,i+LB+FW),bp=prices[i+LB-1];
      var fr=fp.map(function(p){return(p-bp)/bp});
      matches.push({sd:dates[i],ed:dates[i+LB-1],corr:corr,fr:fr,ffr:fr.length?fr[fr.length-1]:0,lbP:prices.slice(i,i+LB),fwP:fp,bp:bp});
    }
  }
  matches.sort(function(a,b){return b.corr-a.corr});
  var top=matches.slice(0,TOP_N);
  if(top.length<2)return{error:'유사 패턴이 부족합니다 (상관계수 > 0.5 기준 '+matches.length+'개)',cp:cp,cd:cd};

  var af=top.map(function(m){return m.fr});
  var nd=Math.min.apply(null,af.map(function(r){return r.length}));
  var sc={bull:[],bear:[],avg:[],maxB:[],minB:[],dates:[]};
  var ld=new Date(cd);
  for(var d=0;d<nd;d++){
    var dr=af.map(function(r){return r[d]}).filter(function(v){return v!==undefined});
    dr.sort(function(a,b){return a-b});
    var avg=dr.reduce(function(s,v){return s+v},0)/dr.length;
    var q1=Math.max(Math.floor(dr.length*0.25),1),q3=Math.floor(dr.length*0.75);
    var bear=dr.slice(0,q1).reduce(function(s,v){return s+v},0)/q1;
    var bull=dr.slice(q3).reduce(function(s,v){return s+v},0)/(dr.length-q3);
    sc.bull.push(cp*(1+bull));sc.bear.push(cp*(1+bear));sc.avg.push(cp*(1+avg));
    sc.maxB.push(cp*(1+dr[dr.length-1]));sc.minB.push(cp*(1+dr[0]));
    var nx=new Date(ld);nx.setDate(nx.getDate()+d+1);sc.dates.push(nx.toISOString().split('T')[0]);
  }
  var up=top.filter(function(m){return m.ffr>0}).length;
  return{cp:cp,cd:cd,sc:sc,top:top,total:matches.length,hP:prices.slice(n-LB),hD:dates.slice(n-LB),
    bullT:sc.bull[sc.bull.length-1],bearT:sc.bear[sc.bear.length-1],avgT:sc.avg[sc.avg.length-1],
    wr:Math.round(up/top.length*100),ac:top.reduce(function(s,m){return s+m.corr},0)/top.length};
}

/* ===== CHART ===== */
var wmPlugin={id:'wm',beforeDraw:function(ch){var cx=ch.ctx,ca=ch.chartArea;if(!ca)return;cx.save();cx.font='600 11px "JetBrains Mono"';cx.fillStyle='rgba(255,255,255,0.04)';cx.textAlign='right';cx.fillText('herdvibe.com',ca.right-4,ca.bottom-8);cx.restore()}};
var divPlugin={id:'div',afterDraw:function(ch){var meta=ch.getDatasetMeta(0);if(!meta||!meta.data)return;var lp=null;for(var i=meta.data.length-1;i>=0;i--){if(ch.data.datasets[0].data[i]!==null){lp=meta.data[i];break}}if(!lp)return;var ctx=ch.ctx,yA=ch.scales.y;ctx.save();ctx.beginPath();ctx.setLineDash([4,4]);ctx.strokeStyle='#333';ctx.lineWidth=1;ctx.moveTo(lp.x,yA.top);ctx.lineTo(lp.x,yA.bottom);ctx.stroke();ctx.font="500 9px 'JetBrains Mono'";ctx.fillStyle='#555';ctx.textAlign='center';ctx.fillText('오늘',lp.x,yA.top-4);ctx.restore()}};
Chart.register(wmPlugin,divPlugin);
Chart.defaults.color='#666';Chart.defaults.borderColor='#1a1a1a';
Chart.defaults.font.family="'JetBrains Mono','Noto Sans KR',sans-serif";Chart.defaults.font.size=10;
Chart.defaults.responsive=true;Chart.defaults.maintainAspectRatio=false;
Chart.defaults.plugins.legend.display=false;
Chart.defaults.elements.point.radius=0;Chart.defaults.elements.point.hoverRadius=4;
Chart.defaults.elements.line.borderWidth=2;Chart.defaults.animation.duration=400;

function buildChart(r,ovs){
  var asset=ASSETS[curAsset],c=asset.color;
  var labels=r.hD.concat(r.sc.dates).map(function(d){return d.slice(5)});
  var hist=r.hP.concat(r.sc.dates.map(function(){return null}));
  var pad=r.hD.map(function(){return null}),cp=r.cp;
  var mk=function(arr){return pad.slice(0,-1).concat([cp]).concat(arr)};
  var ds=[
    {label:'실제 가격',data:hist,borderColor:c,backgroundColor:c+'12',borderWidth:2.5,pointRadius:0,tension:.3,fill:true,order:1},
    {label:'강세 (상위 25%)',data:mk(r.sc.bull),borderColor:'#22c55e',borderWidth:2,borderDash:[6,3],pointRadius:0,tension:.3,fill:false,order:2},
    {label:'평균',data:mk(r.sc.avg),borderColor:'#f59e0b',borderWidth:2,borderDash:[4,4],pointRadius:0,tension:.3,fill:false,order:3},
    {label:'약세 (하위 25%)',data:mk(r.sc.bear),borderColor:'#ef4444',borderWidth:2,borderDash:[6,3],pointRadius:0,tension:.3,fill:false,order:4},
    {label:'_max',data:mk(r.sc.maxB),borderColor:'transparent',backgroundColor:'rgba(34,197,94,0.04)',pointRadius:0,fill:false,tension:.3,order:10},
    {label:'_min',data:mk(r.sc.minB),borderColor:'transparent',backgroundColor:'rgba(239,68,68,0.04)',pointRadius:0,fill:'-1',tension:.3,order:11}
  ];
  ovs.forEach(function(ov,oi){
    var m=ov.data,color=OV_C[oi];
    var fwSF=cp/m.bp;
    var scaledLb=m.lbP.map(function(p){return p*(cp/m.lbP[m.lbP.length-1])});
    var scaledFw=m.fwP.map(function(p){return p*fwSF});
    var ovD=scaledLb.concat(scaledFw);
    while(ovD.length<labels.length)ovD.push(null);
    if(ovD.length>labels.length)ovD=ovD.slice(0,labels.length);
    ds.push({label:m.sd.slice(2)+'~'+m.ed.slice(2),data:ovD,borderColor:color,borderWidth:1.5,borderDash:[2,2],pointRadius:0,tension:.3,fill:false,order:5+oi});
  });
  return{labels:labels,datasets:ds};
}

function renderChart(r){
  var ctx=document.getElementById('mainChart');if(!ctx)return;
  if(mainChart){mainChart.destroy();mainChart=null}
  var cd=buildChart(r,selOv);
  mainChart=new Chart(ctx,{type:'line',data:cd,options:{
    interaction:{mode:'index',intersect:false},
    plugins:{
      legend:{display:true,position:'top',labels:{color:'#999',font:{size:10,family:"'Noto Sans KR'"},boxWidth:10,padding:10,usePointStyle:true,pointStyle:'line',
        filter:function(item){return item.text.charAt(0)!=='_'}}},
      tooltip:{backgroundColor:'#1a1a1a',borderColor:'#333',borderWidth:1,titleColor:'#999',bodyColor:'#eee',
        titleFont:{family:"'JetBrains Mono'",size:10},bodyFont:{family:"'JetBrains Mono'",size:11},
        callbacks:{label:function(c){if(c.raw===null)return null;if(c.dataset.label.charAt(0)==='_')return null;var v=c.raw;return' '+c.dataset.label+': $'+fmtP(v)}}}
    },
    scales:{
      x:{grid:{color:'rgba(255,255,255,0.02)'},ticks:{color:'#777',font:{size:9},maxTicksLimit:12,maxRotation:0}},
      y:{position:'right',grid:{color:'rgba(255,255,255,0.02)'},ticks:{color:'#777',font:{size:9},callback:function(v){return'$'+fmtP(v)}}}
    }
  }});
}

/* ===== SPARKLINE ===== */
function drawSpark(id,rets){
  var c=document.getElementById(id);if(!c)return;
  var ctx=c.getContext('2d');c.width=80;c.height=24;
  if(!rets.length)return;
  var mn=Math.min.apply(null,rets),mx=Math.max.apply(null,rets),rg=mx-mn||0.01;
  var col=rets[rets.length-1]>=0?'#22c55e':'#ef4444';
  ctx.clearRect(0,0,80,24);ctx.beginPath();ctx.strokeStyle=col;ctx.lineWidth=1.5;
  for(var i=0;i<rets.length;i++){var x=(i/(rets.length-1))*80,y=24-((rets[i]-mn)/rg)*20-2;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}
  ctx.stroke();
}

/* ===== FORMAT ===== */
function fmtP(v){if(v==null)return'—';return v>=1000?v.toLocaleString('en',{maximumFractionDigits:0}):v>=10?v.toFixed(1):v.toFixed(2)}
function fmtPct(v,base){var p=((v-base)/base*100);return(p>=0?'+':'')+p.toFixed(1)+'%'}

/* ===== RENDER ===== */

  var asset=ASSETS[curAsset];

      '<div class="sum-card"><div class="lbl">강세 예측 (7일)</div><div class="val" style="color:var(--hv-up)">$'+fmtP(r.bullT)+'</div><div class="sub" style="color:var(--hv-up)">'+fmtPct(r.bullT,cp)+'</div></div>'+
      '<div class="sum-card"><div class="lbl">평균 예측 (7일)</div><div class="val" style="color:var(--hv-warning)">$'+fmtP(r.avgT)+'</div><div class="sub" style="color:'+(r.avgT>=cp?'var(--hv-up)':'var(--hv-down)')+'">'+fmtPct(r.avgT,cp)+'</div></div>'+
      '<div class="sum-card"><div class="lbl">약세 예측 (7일)</div><div class="val" style="color:var(--hv-down)">$'+fmtP(r.bearT)+'</div><div class="sub" style="color:var(--hv-down)">'+fmtPct(r.bearT,cp)+'</div></div>'+

    '</div>'+
    '<div class="chart-card">'+
      '<div class="chart-card-head"><h2>'+asset.name+' 프랙탈 예측<span class="hsub">30일 패턴 → 7일 투영</span></h2></div>'+
      '<div class="chart-card-body"><div class="chart-box"><canvas id="mainChart"></canvas></div></div>'+
      '<div class="share-bar">'+
        '<div class="share-bar-preview"><span>'+asset.name+' 프랙탈 예측</span> — herdvibe.com</div>'+
        '<div class="share-bar-buttons">'+
          '<button class="share-btn share-btn--x" onclick="doShare(\'twitter\')"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg><span class="sl">트위터</span></button>'+
          '<button class="share-btn share-btn--kakao" onclick="doShare(\'kakao\')"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3C6.477 3 2 6.463 2 10.691c0 2.724 1.8 5.112 4.508 6.458l-1.148 4.265a.5.5 0 0 0 .764.533l4.94-3.26c.304.02.612.03.936.03 5.523 0 10-3.462 10-7.735C22 6.463 17.523 3 12 3z"/></svg><span class="sl">카카오톡</span></button>'+
          '<button class="share-btn share-btn--tg" onclick="doShare(\'telegram\')"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.479.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg><span class="sl">텔레그램</span></button>'+
          '<button class="share-btn share-btn--copy" onclick="doShare(\'link\',this)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg><span class="sl">링크 복사</span></button>'+
        '</div>'+
      '</div>'+
    '</div>'+
    '<div class="match-card">'+
      '<div class="match-card-head"><h2>상위 유사 패턴 (피어슨 상관계수 기준)</h2></div>'+
      '<div class="match-hint">패턴을 클릭하면 차트에 오버레이됩니다 (최대 3개)</div>'+
      '<div style="overflow-x:auto"><table class="match-table"><thead><tr><th>#</th><th>기간</th><th>상관계수</th><th>7일 수익률</th><th>7일 경로</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '</div>'+
    '<div class="disc">본 자료는 정보 제공 목적이며 투자 조언이 아닙니다. 과거 패턴은 미래 수익을 보장하지 않습니다.<br>투자 결정은 본인의 판단에 따라 이루어져야 합니다. <a href="https://herdvibe.com" target="_blank" style="color:var(--hv-text-tertiary);font-family:var(--hv-font-mono)">herdvibe.com</a></div>';

  renderChart(r);
  r.top.slice(0,10).forEach(function(m,i){drawSpark('sp-'+i,m.fr)});
  document.getElementById('lastUpdate').textContent=r.cd+' · '+r.total+'개 패턴';

}

/* ===== OVERLAY ===== */
function togOv(idx){
  var ei=-1;
  for(var i=0;i<selOv.length;i++){if(selOv[i].idx===idx){ei=i;break}}
  if(ei>=0)selOv.splice(ei,1);
  else{if(selOv.length>=3)selOv.shift();selOv.push({idx:idx,data:curResult.top[idx]})}
  document.querySelectorAll('.match-table tbody tr').forEach(function(r){r.className=''});
  selOv.forEach(function(ov,oi){var row=document.querySelector('.match-table tbody tr[data-i="'+ov.idx+'"]');if(row)row.className='sel-'+(oi+1)});
  for(var i=0;i<10;i++){var dot=document.getElementById('dot-'+i);if(dot)dot.style.background=''}
  selOv.forEach(function(ov,oi){var dot=document.getElementById('dot-'+ov.idx);if(dot)dot.style.background=OV_C[oi]});
  renderChart(curResult);
}

/* ===== ASSET GRID ===== */
function renderGrid(){
  var g=document.getElementById('assetGrid');g.innerHTML='';
  ORDER.forEach(function(k){
    var a=ASSETS[k];if(!a)return;
    var b=document.createElement('button');
    b.className='asset-btn'+(k===curAsset?' active':'');
    b.dataset.asset=k;b.dataset.category=a.cat;
    b.style.setProperty('--ac',a.color);
    b.innerHTML='<span class="dot" style="background:'+a.color+'"></span>'+a.name+'<span class="tk">'+k.replace('_USD','')+'</span>';
    b.onclick=function(){selAsset(k)};
    g.appendChild(b);
  });
}

async function selAsset(k){
  curAsset=k;selOv=[];
  document.querySelectorAll('.asset-btn').forEach(function(b){b.classList.toggle('active',b.dataset.asset===k)});
  var asset=ASSETS[k];
  document.getElementById('mainContent').innerHTML='<div class="loading-overlay"><div class="spinner"></div><div class="loading-text">'+asset.name+' 분석 중...</div></div>';
  try{
    var data=await loadCSV(k);
    var result=analyze(data);
    renderDashboard(result);
  }catch(e){
    document.getElementById('mainContent').innerHTML='<div class="loading-overlay"><div style="color:var(--hv-down)">데이터 로드 실패: '+e.message+'</div></div>';
  }
}

/* ===== CATEGORY FILTER ===== */
function bindCats(){
  document.querySelectorAll('.cat-btn').forEach(function(b){
    b.onclick=function(){
      var cat=b.dataset.cat;
      document.querySelectorAll('.cat-btn').forEach(function(x){x.classList.remove('active')});
      b.classList.add('active');
      document.querySelectorAll('.asset-btn').forEach(function(ab){
        ab.classList.toggle('hidden',cat!=='all'&&ab.dataset.category!==cat);
      });
      var cur=document.querySelector('.asset-btn[data-asset="'+curAsset+'"]');
      if(cur&&cur.classList.contains('hidden')){
        var f=document.querySelector('.asset-btn:not(.hidden)');
        if(f)selAsset(f.dataset.asset);
      }
    };
  });
}

/* ===== SHARE ===== */
var SHARE_URL='https://herdvibe.com/69';
function ensureKakao(){try{if(typeof Kakao!=='undefined'&&!Kakao.isInitialized())Kakao.init('a43ed7b39fac35458f4f9df925a279b5');return typeof Kakao!=='undefined'&&Kakao.isInitialized()}catch(e){return false}}
ensureKakao();
function doShare(p,btn){
  var a=ASSETS[curAsset],u=SHARE_URL;
  var t=encodeURIComponent(a.name+' 프랙탈 예측 — 향후 7일 시나리오 | herdvibe.com'),eu=encodeURIComponent(u);
  switch(p){
    case'twitter':window.open('https://twitter.com/intent/tweet?text='+t+'&url='+eu,'_blank');break;
    case'telegram':window.open('https://t.me/share/url?url='+eu+'&text='+t,'_blank');break;
    case'kakao':if(!ensureKakao()){cpClip(u);toast('링크 복사완료!');return}
      try{Kakao.Share.sendDefault({objectType:'feed',content:{title:a.name+' 프랙탈 예측 | Herdvibe',description:'과거 30일 패턴 기반 향후 7일 가격 시나리오',imageUrl:'https://raw.githubusercontent.com/kittycapital/kittycapital.github.io/main/assets/herdvibe-og.png',link:{mobileWebUrl:u,webUrl:u}},buttons:[{title:'대시보드 보기',link:{mobileWebUrl:u,webUrl:u}}]})}catch(e){cpClip(u);toast('링크 복사완료!')}break;
    case'link':cpClip(u);flashCp(btn);toast('링크가 복사되었습니다');break;
  }
}
function cpClip(t){try{navigator.clipboard.writeText(t)}catch(e){try{window.parent.postMessage({type:'clipboard',text:t},'*')}catch(_){}}}
function flashCp(b){if(!b)return;var o=b.innerHTML;b.style.background='#22c55e';b.style.color='#fff';b.style.borderColor='#22c55e';b.innerHTML='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M5 13l4 4L19 7"/></svg><span class="sl" style="color:#fff">복사됨!</span>';setTimeout(function(){b.style.background='';b.style.color='';b.style.borderColor='';b.innerHTML=o},2000)}
function toast(m){var c=document.querySelector('.toast-wrap');if(!c){c=document.createElement('div');c.className='toast-wrap';document.body.appendChild(c)}var t=document.createElement('div');t.className='toast';t.textContent=m;c.appendChild(t);setTimeout(function(){t.style.opacity='0';t.style.transform='translateY(12px)';t.style.transition='.3s';setTimeout(function(){t.remove()},300)},3000)}

/* ===== RESIZE ===== */
var _lastH=0,_ht,_settled=false;
function sendHeight(){
  clearTimeout(_ht);
  _ht=setTimeout(function(){
    var h=document.documentElement.scrollHeight;
    if(Math.abs(h-_lastH)>20){_lastH=h;_settled=false;window.parent.postMessage({type:'resize',height:h,id:'hvAssetFractal'},'*')}
    else if(!_settled){_settled=true;window.parent.postMessage({type:'resize',height:h,id:'hvAssetFractal'},'*')}
  },300);
}
window.addEventListener('message',function(e){if(e.data&&e.data.type==='requestResize'){_lastH=0;_settled=false;sendHeight()}});
window.addEventListener('resize',sendHeight);

/* ===== INIT ===== */
renderGrid();bindCats();selAsset('SPY');
</script>
