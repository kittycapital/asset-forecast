name: Daily Forecast Update

on:
  schedule:
    # 매일 UTC 06:00 (한국 시간 15:00) — 미국 장 마감 후
    - cron: '0 6 * * 1-6'
  workflow_dispatch: # 수동 실행 가능

jobs:
  update-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest price data
        run: python scripts/fetch_latest.py

      - name: Run forecast models
        run: python scripts/forecast.py

      - name: Copy output to docs
        run: |
          mkdir -p docs/data
          cp output/all_forecasts.json docs/data/

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/ output/ docs/data/
          git diff --cached --quiet || git commit -m "📊 Daily forecast update $(date -u +'%Y-%m-%d')"
          git push
